<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bedrock</title>
<meta name="theme-color" content="#161512">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#faf8f4; --fg:#1c1a17; --muted:#6d675e; --line:#e2ddd3;
  --card:#fff; --accent:#7a5c2e; --ok:#3f6b45; --miss:#8c4a3f;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#161512; --fg:#efeae1; --muted:#9a9287; --line:#2e2b26;
         --card:#1e1c19; --accent:#c9a464; --ok:#7fae86; --miss:#d0897c; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.55 ui-serif,Georgia,'Times New Roman',serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:34rem;margin:0 auto;padding:1.25rem 1.1rem 5rem}
header{display:flex;align-items:baseline;gap:.6rem;margin-bottom:.25rem}
h1{font-size:1.5rem;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.85rem}
.bar{display:flex;gap:1.25rem;margin:1rem 0 1.5rem;padding:.7rem .9rem;
  background:var(--card);border:1px solid var(--line);border-radius:.6rem}
.stat b{display:block;font-size:1.25rem;line-height:1.2}
.stat span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
button{font:inherit;cursor:pointer;border-radius:.55rem;border:1px solid var(--line);
  background:var(--card);color:var(--fg);padding:.7rem 1rem}
button:active{transform:translateY(1px)}
.lesson{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;
  margin-bottom:.5rem;padding:.85rem .95rem}
.num{flex:0 0 1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.lesson.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.lesson .t{flex:1}
.lesson .t small{display:block;color:var(--muted);font-size:.78rem}
.teach{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:.5rem;padding:.9rem 1rem;margin:0 0 1rem}
.ctx{background:transparent;border:1px dashed var(--line);border-radius:.5rem;
  padding:.9rem 1rem;margin:0 0 1rem;color:var(--muted);font-size:.94rem}
.ctx b{color:var(--fg)}
.say{font-size:2rem;color:var(--fg);margin:0 0 .2rem;letter-spacing:.01em}
.ans{font-size:.98rem;color:var(--muted);margin:1rem 0 0;text-align:left;line-height:1.6}
.ans b{color:var(--accent)}
.phon{margin:.9rem 0 0;text-align:left;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9rem}
.phon div{display:flex;gap:.6rem;align-items:baseline;padding:.25rem 0}
.phon .mark{flex:0 0 1rem;font-family:inherit}
.phon .x{color:var(--miss)}
.phon .v{color:var(--ok)}
.phon .lbl{color:var(--muted);font-size:.72rem;font-family:ui-serif,Georgia,serif;
  text-transform:uppercase;letter-spacing:.05em;flex:0 0 5.5rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:.7rem;
  padding:1.6rem 1.2rem;text-align:center;margin-bottom:1rem}
.en{font-size:1.35rem;margin:0 0 .3rem}
.hint{color:var(--muted);font-size:.8rem;margin:0}
.es{font-size:1.5rem;color:var(--accent);margin:1rem 0 0;font-weight:600}
.row{display:flex;gap:.6rem}
.row button{flex:1}
.ok{border-color:var(--ok);color:var(--ok)}
.miss{border-color:var(--miss);color:var(--miss)}
.prog{height:3px;background:var(--line);border-radius:2px;margin-bottom:1.2rem;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.link{background:none;border:none;color:var(--muted);padding:.4rem 0;
  text-decoration:underline;text-underline-offset:3px}
footer{margin-top:2rem;color:var(--muted);font-size:.78rem;border-top:1px solid var(--line);padding-top:.9rem}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Bedrock</h1><span class="sub">Spanish · draft</span></header>

  <!-- HOME -->
  <section id="home">
    <div class="bar">
      <div class="stat"><b id="s-streak">0</b><span>day streak</span></div>
      <div class="stat"><b id="s-done">0</b><span>lessons</span></div>
      <div class="stat"><b id="s-acc">–</b><span>accuracy</span></div>
    </div>
    <div id="list"></div>
    <button class="link" id="review-btn">Review what I missed</button>
    <footer>
      Everything stays on this device. Nothing is sent anywhere.
      <button class="link" id="export">Export my data</button> ·
      <button class="link" id="reset">Reset</button>
    </footer>
  </section>

  <!-- LESSON -->
  <section id="play" class="hidden">
    <div class="prog"><i id="bar"></i></div>
    <div id="stage"></div>
    <button class="link" id="quit">← back</button>
  </section>
</div>

<script>
// ---------- append-only event log ----------
const KEY='bedrock.events.v1';
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
let events=load();
function log(e){events.push({...e,t:new Date().toISOString()});
  localStorage.setItem(KEY,JSON.stringify(events));}

// state is DERIVED from the log, never stored
function derive(){
  const seen={},done=new Set();let ok=0,n=0;
  for(const e of events){
    if(e.type==='answer'){const k=e.lesson+':'+e.i;
      (seen[k]=seen[k]||{ok:0,miss:0,lesson:e.lesson,i:e.i});
      e.result==='ok'?(seen[k].ok++,ok++):seen[k].miss++; n++;}
    if(e.type==='lesson_done')done.add(e.lesson);
  }
  const days=[...new Set(events.map(e=>e.t.slice(0,10)))].sort();
  let streak=0;const d=new Date();
  for(;;){const s=d.toISOString().slice(0,10);
    if(days.includes(s)){streak++;d.setDate(d.getDate()-1);}
    else if(streak===0&&days.includes(new Date(d.getTime()-864e5).toISOString().slice(0,10))){d.setDate(d.getDate()-1);}
    else break;}
  return{seen,done,streak,acc:n?Math.round(ok/n*100):null};
}

// ---------- app ----------
let LESSONS=[],cur=null,step=0;
const $=s=>document.querySelector(s);

fetch('lessons.json').then(r=>r.json()).then(d=>{LESSONS=d.lessons;home();});

function home(){
  const st=derive();
  $('#s-streak').textContent=st.streak;
  $('#s-done').textContent=st.done.size+'/'+LESSONS.length;
  $('#s-acc').textContent=st.acc===null?'–':st.acc+'%';
  $('#list').innerHTML='';
  LESSONS.forEach(l=>{
    const b=document.createElement('button');
    b.className='lesson'+(st.done.has(l.id)?' done':'');
    b.innerHTML=`<span class="num">${st.done.has(l.id)?'✓':l.id}</span>
      <span class="t">${l.title}<small>${l.decision}</small></span>`;
    b.onclick=()=>start(l);
    $('#list').appendChild(b);
  });
  $('#play').classList.add('hidden');$('#home').classList.remove('hidden');
}

function start(l){cur=l;step=0;
  $('#home').classList.add('hidden');$('#play').classList.remove('hidden');render();}

// buttons land in the same spot each render, so a stray second tap would skip
// a step. Make them inert for a moment after anything redraws.
function guard(){
  const bs=[...document.querySelectorAll('#stage button')];
  bs.forEach(b=>b.disabled=true);
  setTimeout(()=>bs.forEach(b=>b.disabled=false),250);
}

function render(){
  if(step>=cur.blocks.length){log({type:'lesson_done',lesson:cur.id});return home();}
  const b=cur.blocks[step];
  $('#bar').style.width=(step/cur.blocks.length*100)+'%';
  if(b.t==='teach'||b.t==='context'){
    $('#stage').innerHTML=`<p class="${b.t==='context'?'ctx':'teach'}">${b.text}</p>
      <div class="row"><button id="next">Continue</button></div>`;
    $('#next').onclick=()=>{step++;render();};
  }else if(b.t==='say'){
    // Spanish shown first — attempt it, get it wrong, then learn why
    $('#stage').innerHTML=`<div class="card">
        <p class="say">${b.es}</p><p class="hint">say it out loud, commit to a guess</p></div>
      <div class="row"><button id="show">Where's the weight?</button></div>`;
    $('#show').onclick=()=>{
      const phon=(b.wrong&&b.right)?`<div class="phon">
          <div><span class="mark x">✗</span><span class="lbl">English habit</span><span class="x">${b.wrong}</span></div>
          <div><span class="mark v">✓</span><span class="lbl">Spanish</span><span class="v">${b.right}</span></div>
        </div>`:'';
      $('#stage').innerHTML=`<div class="card">
          <p class="say">${b.es}</p>${phon}<p class="ans">${b.a}</p></div>
        <div class="row">
          <button class="miss" id="m">I had it wrong</button>
          <button class="ok" id="o">I had it right</button></div>`;
      $('#o').onclick=()=>ans('ok');$('#m').onclick=()=>ans('miss');
      guard();
    };
  }else{
    $('#stage').innerHTML=`<div class="card">
        <p class="en">${b.en}</p><p class="hint">say it out loud, then check</p></div>
      <div class="row"><button id="show">Show me</button></div>`;
    $('#show').onclick=()=>{
      $('#stage').innerHTML=`<div class="card">
          <p class="en">${b.en}</p><p class="es">${b.es}</p></div>
        <div class="row">
          <button class="miss" id="m">Missed it</button>
          <button class="ok" id="o">Got it</button></div>`;
      $('#o').onclick=()=>ans('ok');$('#m').onclick=()=>ans('miss');
      guard();
    };
  }
  guard();
}
function ans(r){log({type:'answer',lesson:cur.id,i:step,result:r});step++;render();}

// review = prompts previously missed, derived from the log
$('#review-btn').onclick=()=>{
  const st=derive();
  const items=Object.values(st.seen).filter(x=>x.miss>x.ok);
  if(!items.length)return alert('Nothing to review yet — miss a few first.');
  cur={id:'review',title:'Review',blocks:items.map(x=>LESSONS.find(l=>l.id===x.lesson).blocks[x.i])};
  step=0;$('#home').classList.add('hidden');$('#play').classList.remove('hidden');render();
};

$('#quit').onclick=home;
$('#export').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(events,null,2)],{type:'application/json'}));
  a.download='bedrock-events.json';a.click();
};
$('#reset').onclick=()=>{if(confirm('Delete all progress on this device?')){
  localStorage.removeItem(KEY);events=[];home();}};

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
