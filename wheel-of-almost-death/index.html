<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wheel of Almost Death</title>
<meta name="description" content="Spin it. Do it. Rate it. Live with it.">
<meta name="theme-color" content="#15100E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Almost Death">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bevan:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15100E;
    --ink-2:#1E1715;
    --oxblood:#6E1F1B;
    --bone:#EDE3D2;
    --brass:#C9922F;
    --teal:#2A7F7A;
    --rule:#3A2E2A;
    --stage: min(88vw, 400px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink);
    color:var(--bone);
    font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    font-size:16px;
    line-height:1.45;
    min-height:100dvh;
    overflow-x:hidden;
    padding:0 0 env(safe-area-inset-bottom);
    background-image:
      radial-gradient(120% 80% at 50% 0%, #241A17 0%, transparent 60%),
      repeating-linear-gradient(0deg, rgba(237,227,210,.014) 0 1px, transparent 1px 3px);
  }
  .wrap{max-width:520px;margin:0 auto;padding:22px 20px 56px}

  /* ---------- masthead ---------- */
  .eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:10px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--brass);margin:0 0 10px;
  }
  h1{
    font-family:"Bevan","Rockwell","Roboto Slab",Georgia,serif;
    font-weight:400;
    font-size:clamp(34px,11.5vw,52px);
    line-height:.92;
    letter-spacing:-.01em;
    margin:0;
    text-transform:uppercase;
    color:var(--bone);
    text-shadow:0 2px 0 #2A1E1B, 0 3px 14px rgba(0,0,0,.55);
  }
  h1 em{font-style:italic;color:var(--oxblood);-webkit-text-stroke:0}
  .tagline{margin:12px 0 0;font-size:14px;color:#A29684;max-width:32ch}
  .hr{height:1px;background:var(--rule);margin:22px 0 8px}

  /* ---------- stage ---------- */
  .stage{
    position:relative;width:var(--stage);height:var(--stage);
    margin:14px auto 0;display:grid;place-items:center;
  }
  .stage::before{
    content:"";position:absolute;inset:-14px;border-radius:50%;
    background:radial-gradient(circle at 50% 42%, #2A201C 0%, #150F0D 70%);
    box-shadow:0 24px 60px rgba(0,0,0,.6), inset 0 0 0 1px #3A2E2A;
  }
  #wheel{
    position:relative;width:100%;height:100%;display:block;border-radius:50%;
    will-change:transform;
    box-shadow:0 0 0 6px #2A201C, 0 0 0 7px var(--brass), 0 10px 30px rgba(0,0,0,.55);
  }
  .ticker{
    position:absolute;top:-20px;left:50%;width:26px;height:52px;
    margin-left:-13px;transform-origin:50% 8px;
    z-index:4;pointer-events:none;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.7));
    transition:transform .16s cubic-bezier(.2,1.6,.4,1);
  }
  .hub{
    position:absolute;z-index:5;
    width:30%;height:30%;border-radius:50%;
    border:1px solid var(--brass);
    background:radial-gradient(circle at 50% 34%, #33261F 0%, #170F0D 78%);
    color:var(--bone);
    font-family:"Bevan","Rockwell",Georgia,serif;
    font-size:clamp(13px,3.6vw,17px);letter-spacing:.06em;text-transform:uppercase;
    display:grid;place-items:center;cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.6), inset 0 1px 0 rgba(237,227,210,.16);
    transition:transform .12s ease;
  }
  .hub:active{transform:scale(.94)}
  .hub:disabled{cursor:not-allowed;color:#6A5D51;border-color:#4A3B2A}
  .hub:focus-visible{outline:2px solid var(--brass);outline-offset:4px}

  /* ---------- verdict ---------- */
  .verdict{
    margin:30px auto 0;padding:16px 15px;
    border:1px dashed var(--rule);border-radius:3px;
    background:linear-gradient(#1B1412,#171110);
  }
  .verdict .label{
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.28em;
    text-transform:uppercase;color:#7C6F60;text-align:center;
  }
  .verdict .value{
    font-family:"Bevan","Rockwell",Georgia,serif;
    font-size:clamp(19px,5.8vw,27px);line-height:1.12;margin-top:8px;
    text-transform:uppercase;color:#5C5045;word-break:break-word;text-align:center;
  }
  .verdict.is-set .value{color:var(--bone);animation:stamp .38s cubic-bezier(.2,1.5,.35,1) both}
  .verdict.is-set{border-style:solid;border-color:var(--oxblood)}
  @keyframes stamp{
    0%{transform:scale(1.5) rotate(-4deg);opacity:0;filter:blur(3px)}
    60%{opacity:1;filter:blur(0)}
    100%{transform:scale(1) rotate(-1.2deg);opacity:1}
  }
  .vfull{
    margin:12px 0 0;font-size:14.5px;color:#CBBFAD;text-align:center;
    display:none;
  }
  .verdict.is-set .vfull{display:block}

  .rp{
    display:none;margin:15px 0 0;padding:11px 12px;
    border-left:3px solid var(--oxblood);background:#1F1513;border-radius:2px;
  }
  .verdict.is-set .rp{display:block}
  .rp .rp-label{
    font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--oxblood);margin-bottom:5px;
  }
  .rp .rp-text{font-size:14px;color:#D6CAB8}

  /* ---------- suds logging ---------- */
  .sudsbar{display:none;margin-top:15px;padding-top:14px;border-top:1px solid #2A211D}
  .verdict.is-set .sudsbar{display:block}
  .sudsbar .prevline{
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.2em;
    text-transform:uppercase;color:#7C6F60;text-align:center;margin-bottom:11px;
  }
  .sudsbar .prevline b{color:var(--brass);font-weight:500;letter-spacing:.08em}
  .sudsrow{display:flex;gap:8px;align-items:center}
  .sudsrow input[type=number]{
    flex:1;min-width:0;text-align:center;
    background:#100C0B;color:var(--bone);
    border:1px solid var(--rule);border-radius:3px;
    padding:12px 10px;font:inherit;font-size:17px;
    font-family:"IBM Plex Mono",monospace;
  }
  .sudsrow input[type=number]:focus{outline:none;border-color:var(--brass)}
  .sudsrow input::-webkit-outer-spin-button,
  .sudsrow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .sudsrow input[type=number]{-moz-appearance:textfield}
  .logged{
    text-align:center;font-family:"IBM Plex Mono",monospace;font-size:11px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--teal);
    margin-top:10px;min-height:14px;
  }

  /* ---------- sections ---------- */
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 4px}
  .sec-head h2{
    font-family:"IBM Plex Mono",monospace;font-weight:500;
    font-size:11px;letter-spacing:.24em;text-transform:uppercase;
    color:#A29684;margin:0;
  }
  .count{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--brass)}
  .sec-note{font-size:12.5px;color:#6A5D51;margin:0 0 12px}

  ul{list-style:none;margin:12px 0 0;padding:0}
  li.item{border-bottom:1px solid #241C19;padding:3px 0}
  .row{display:flex;align-items:center;gap:11px;padding:9px 4px;cursor:pointer}
  .row .swatch{width:11px;height:11px;border-radius:2px;flex:none;transform:rotate(45deg)}
  .row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
  .badge{
    flex:none;font-family:"IBM Plex Mono",monospace;font-size:12px;
    min-width:42px;text-align:center;padding:3px 7px;border-radius:2px;
    border:1px solid var(--rule);color:#6A5D51;background:#161110;
  }
  .badge.has{color:var(--bone)}
  .delta{
    flex:none;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
    min-width:34px;text-align:right;color:#6A5D51;
  }
  .delta.down{color:var(--teal)}
  .delta.up{color:var(--oxblood)}

  .detail{display:none;padding:2px 4px 14px 26px}
  li.open .detail{display:block}
  .detail .full{font-size:14px;color:#CBBFAD;margin-bottom:10px}
  .detail .rp-mini{
    font-size:13.5px;color:#B8AC9A;
    border-left:3px solid var(--oxblood);padding:7px 11px;background:#1F1513;border-radius:2px;
  }
  .detail .rp-mini span{
    display:block;font-family:"IBM Plex Mono",monospace;font-size:9px;
    letter-spacing:.24em;text-transform:uppercase;color:var(--oxblood);margin-bottom:4px;
  }
  .detail .acts{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}

  .empty{color:#6A5D51;font-size:14px;padding:16px 4px;border-bottom:1px solid #241C19}

  .adder{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .adder .pair{display:flex;gap:8px}
  input[type=text]{
    flex:1;min-width:0;
    background:#100C0B;color:var(--bone);
    border:1px solid var(--rule);border-radius:3px;
    padding:12px;font:inherit;font-size:16px;
  }
  input[type=text]::placeholder{color:#6A5D51}
  input[type=text]:focus{outline:none;border-color:var(--brass)}
  .btn{
    border:1px solid var(--rule);border-radius:3px;
    background:#241A17;color:var(--bone);
    font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.12em;
    text-transform:uppercase;padding:10px 16px;cursor:pointer;
  }
  .btn:hover{border-color:var(--brass);color:var(--brass)}
  .btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .btn.sm{padding:7px 12px;font-size:11px}
  .btn.danger:hover{border-color:var(--oxblood);color:var(--oxblood)}

  .foot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:18px;flex-wrap:wrap}
  label.toggle{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;color:#A29684}
  label.toggle input{accent-color:var(--oxblood);width:17px;height:17px}
  .linkish{
    background:none;border:0;padding:4px 0;cursor:pointer;
    font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:#6A5D51;
  }
  .linkish:hover{color:var(--oxblood)}
  .colophon{
    margin-top:38px;padding-top:16px;border-top:1px solid var(--rule);
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.2em;
    text-transform:uppercase;color:#4E443B;display:flex;justify-content:space-between;gap:10px;
  }
  .colophon a{color:#4E443B;text-decoration:none}
  .colophon a:hover{color:var(--brass)}
  #install{display:none}
  #install.show{display:inline-block}

  @media (prefers-reduced-motion:reduce){
    .ticker{transition:none}
    .verdict.is-set .value{animation:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Arrosho &middot; Decision Apparatus No. 1</p>
    <h1>Wheel of<br><em>Almost</em> Death</h1>
    <p class="tagline">Spin it. Do it. Rate it. The wheel picks, because choosing is the compulsion.</p>
  </header>

  <div class="hr"></div>

  <div class="stage">
    <canvas id="wheel" width="800" height="800" aria-label="Exposure wheel"></canvas>
    <svg class="ticker" viewBox="0 0 26 52" aria-hidden="true">
      <circle cx="13" cy="8" r="5.5" fill="#C9922F"/>
      <circle cx="13" cy="8" r="2" fill="#15100E"/>
      <path d="M8.5 10 H17.5 L13 30 Z" fill="#C9922F"/>
      <path d="M13 10 L17.5 10 L13 30 Z" fill="#8E6415"/>
    </svg>
    <button class="hub" id="spin" type="button">Spin</button>
  </div>

  <div class="verdict" id="verdict">
    <div class="label" id="verdictLabel">Awaiting fate</div>
    <div class="value" id="verdictValue">&mdash;</div>
    <p class="vfull" id="verdictFull"></p>

    <div class="rp">
      <div class="rp-label">No matter what</div>
      <div class="rp-text" id="verdictRp"></div>
    </div>

    <div class="sudsbar">
      <div class="prevline" id="prevLine"></div>
      <div class="sudsrow">
        <input type="number" id="sudsInput" min="0" max="100" inputmode="numeric"
               placeholder="0&ndash;100" aria-label="Distress rating out of 100">
        <button class="btn" id="logSuds" type="button">Log</button>
      </div>
      <div class="logged" id="loggedMsg"></div>
    </div>
  </div>

  <section>
    <div class="sec-head">
      <h2>Active &middot; SUDS</h2>
      <span class="count" id="count">0</span>
    </div>
    <p class="sec-note">The number is how it felt last time. Do it, then replace it.</p>

    <ul id="list"></ul>

    <div class="adder">
      <input type="text" id="newOption" placeholder="New exposure" maxlength="90"
             autocomplete="off" autocapitalize="sentences" spellcheck="false">
      <div class="pair">
        <input type="text" id="newRp" placeholder="Response prevention &mdash; no matter what" maxlength="140"
               autocomplete="off" autocapitalize="sentences" spellcheck="false">
        <button class="btn" id="add" type="button">Add</button>
      </div>
    </div>

    <div class="foot">
      <label class="toggle">
        <input type="checkbox" id="eliminate">
        Take it off the wheel once it&rsquo;s spun
      </label>
      <button class="linkish" id="reset" type="button">Reset to default list</button>
    </div>
  </section>

  <div class="colophon">
    <span><button class="linkish" id="install" type="button" style="letter-spacing:.2em">Install app</button></span>
    <a href="https://arrosho.com">arrosho.com</a>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- the active list ---------- */
  /* Passives are deliberately not here. They are situational, not spinnable. */
  var DEFAULTS = [
    { n:1,  short:"I was wrong",
      full:"Say “I was wrong about that, you were right” to whoever last corrected me, within the hour",
      rp:"No “but I meant,” no explaining what I originally thought" },
    { n:2,  short:"Ship it raw",
      full:"Send a real work deliverable with zero framing around it",
      rp:"Delete every pre-apology: “quick draft,” “sorry for the delay,” “let me know if this isn’t what you wanted”" },
    { n:3,  short:"Flat claim",
      full:"State an opinion I’m confident in as a flat claim",
      rp:"No “I think,” no “maybe,” no “I could be wrong”" },
    { n:4,  short:"Answer instantly",
      full:"Answer a question the instant it’s asked, first instinct, out loud",
      rp:"No “I’m not sure, but”" },
    { n:7,  short:"Send 500 words",
      full:"Send 500 words of To Know and Not Do to one person as finished work",
      rp:"Don’t call it a draft. Don’t ask what they think." },
    { n:8,  short:"60-second call",
      full:"Make a decision in 60 seconds and act on it",
      rp:"No revisiting it for 24 hours" },
    { n:9,  short:"You’re right, thanks",
      full:"Get corrected publicly and reply only “You’re right, thanks”",
      rp:"No follow-up defending the original position, not later either" },
    { n:11, short:"What did I get wrong",
      full:"Ask someone who knows me well what I’ve been wrong about and haven’t admitted — then agree with the first thing they say",
      rp:"No debating, no context, no “well in fairness”" },
    { n:12, short:"What I didn’t do",
      full:"Name out loud a specific thing I’ve taught or written and then didn’t do",
      rp:"No wrapping it in self-punishment. State the fact and stop. Don’t add “which makes me a hypocrite” — that’s the neutralizer." }
  ];

  function seed(){
    return DEFAULTS.map(function(d){
      return { n:d.n, short:d.short, full:d.full, rp:d.rp, suds:null, prev:null };
    });
  }

  /* ---------- storage ---------- */
  var KEY = "woad.v2";
  var mem = null;
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return mem;
  }
  function save(state){
    mem = state;
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }

  var saved = load();
  var items = (saved && Array.isArray(saved.items) && saved.items.length) ? saved.items : seed();
  var eliminate = !!(saved && saved.eliminate);

  // repair anything half-shaped from an older save
  items = items.filter(Boolean).map(function(it){
    return {
      n: it.n,
      short: String(it.short || it.full || "Untitled").slice(0,60),
      full: String(it.full || it.short || "Untitled"),
      rp: String(it.rp || ""),
      suds: (typeof it.suds === "number") ? it.suds : null,
      prev: (typeof it.prev === "number") ? it.prev : null
    };
  });

  /* ---------- palette ---------- */
  var PALETTE = ["#6E1F1B","#C9922F","#2A7F7A","#8E4B22","#4A3D6B","#7C7A2E"];
  function colorFor(i,n){
    var c = PALETTE[i % PALETTE.length];
    if(n > 1 && i === n-1 && c === PALETTE[0]) c = PALETTE[Math.floor(PALETTE.length/2)];
    return c;
  }
  function sudsColor(v){
    if(v === null || v === undefined) return "#6A5D51";
    if(v >= 70) return "#C4564E";
    if(v >= 40) return "#C9922F";
    return "#2A7F7A";
  }

  /* ---------- elements ---------- */
  var cv = document.getElementById("wheel");
  var ctx = cv.getContext("2d");
  var ticker = document.querySelector(".ticker");
  var spinBtn = document.getElementById("spin");
  var listEl = document.getElementById("list");
  var countEl = document.getElementById("count");
  var input = document.getElementById("newOption");
  var rpInput = document.getElementById("newRp");
  var verdict = document.getElementById("verdict");
  var vLabel = document.getElementById("verdictLabel");
  var vValue = document.getElementById("verdictValue");
  var vFull = document.getElementById("verdictFull");
  var vRp = document.getElementById("verdictRp");
  var prevLine = document.getElementById("prevLine");
  var sudsInput = document.getElementById("sudsInput");
  var logBtn = document.getElementById("logSuds");
  var loggedMsg = document.getElementById("loggedMsg");
  var elimBox = document.getElementById("eliminate");
  elimBox.checked = eliminate;

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  // hold the item itself, not its index — the list can be edited between
  // spinning and logging, and an index would then point at the wrong exposure
  var currentItem = null;
  var pendingRemoval = null;

  /* ---------- wheel drawing ---------- */
  var rotation = 0, velocity = 0, spinning = false, lastPeg = -1;

  function sizeCanvas(){
    var rect = cv.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    var px = Math.max(240, Math.round(rect.width * dpr));
    if(cv.width !== px){ cv.width = px; cv.height = px; }
    draw();
  }

  function fitText(text, maxPx, startPx){
    var size = startPx;
    ctx.font = "500 " + size + "px 'IBM Plex Sans', system-ui, sans-serif";
    while(ctx.measureText(text).width > maxPx && size > 9){
      size -= 1;
      ctx.font = "500 " + size + "px 'IBM Plex Sans', system-ui, sans-serif";
    }
    if(ctx.measureText(text).width > maxPx){
      var t = text;
      while(t.length > 1 && ctx.measureText(t + "…").width > maxPx) t = t.slice(0,-1);
      text = t + "…";
    }
    return text;
  }

  function draw(){
    var S = cv.width, R = S/2, cx = R, cy = R;
    ctx.clearRect(0,0,S,S);
    var n = items.length;

    if(n === 0){
      ctx.fillStyle = "#1E1715";
      ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = "#6A5D51";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "500 " + Math.round(S*0.038) + "px 'IBM Plex Mono', monospace";
      ctx.fillText("EMPTY", cx, cy - S*0.10);
      return;
    }

    var seg = (Math.PI*2)/n;
    for(var i=0;i<n;i++){
      var a0 = -Math.PI/2 + i*seg;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,R,a0,a0+seg);
      ctx.closePath();
      ctx.fillStyle = colorFor(i,n);
      ctx.fill();
      if(n > 1){
        ctx.strokeStyle = "rgba(21,16,14,.55)";
        ctx.lineWidth = Math.max(1, S*0.004);
        ctx.stroke();
      }

      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(a0 + seg/2);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      var base = Math.min(Math.round(S*0.042), Math.round(seg * R * 0.55));
      var label = fitText(String(items[i].short), R*0.60, Math.max(10, base));
      ctx.fillStyle = "#F3ECE0";
      ctx.shadowColor = "rgba(0,0,0,.45)";
      ctx.shadowBlur = S*0.008;
      ctx.fillText(label, R*0.86, 0);
      ctx.restore();
    }

    for(var j=0;j<n;j++){
      var pa = -Math.PI/2 + j*seg;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(pa)*R*0.955, cy + Math.sin(pa)*R*0.955, Math.max(1.5,S*0.009), 0, Math.PI*2);
      ctx.fillStyle = "#EDE3D2";
      ctx.fill();
    }

    ctx.beginPath(); ctx.arc(cx,cy,R*0.985,0,Math.PI*2);
    ctx.strokeStyle = "rgba(21,16,14,.5)"; ctx.lineWidth = Math.max(2,S*0.012); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,R*0.20,0,Math.PI*2);
    ctx.fillStyle = "#15100E"; ctx.fill();
    ctx.strokeStyle = "#C9922F"; ctx.lineWidth = Math.max(1,S*0.005); ctx.stroke();
  }

  function apply(){ cv.style.transform = "rotate(" + rotation + "rad)"; }

  function pointerIndex(){
    var n = items.length;
    if(!n) return -1;
    var seg = (Math.PI*2)/n;
    var a = (-rotation) % (Math.PI*2);
    if(a < 0) a += Math.PI*2;
    return Math.floor(a/seg) % n;
  }

  /* ---------- clack ---------- */
  var actx = null;
  function clack(strength){
    if(reduced) return;
    ticker.style.transform = "rotate(" + (-16*Math.min(1,strength)) + "deg)";
    setTimeout(function(){ ticker.style.transform = "rotate(0deg)"; }, 60);
    try{
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var t = actx.currentTime;
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(880 + Math.random()*120, t);
      o.frequency.exponentialRampToValueAtTime(220, t + 0.05);
      g.gain.setValueAtTime(0.10 * Math.min(1, strength), t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + 0.07);
    }catch(e){}
  }

  /* ---------- spin ---------- */
  function spin(){
    // a winner marked for removal last time comes off now, not at settle,
    // so there was a window in which to log its SUDS
    if(pendingRemoval){
      var pi = items.indexOf(pendingRemoval);
      if(pi > -1) items.splice(pi,1);
      pendingRemoval = null;
      persist(); render();
    }
    if(spinning || items.length < 2) return;
    spinning = true;
    spinBtn.disabled = true;
    spinBtn.textContent = "• • •";
    verdict.classList.remove("is-set");
    vLabel.textContent = "Deciding";
    vValue.textContent = "—";
    loggedMsg.textContent = "";
    sudsInput.value = "";

    velocity = (reduced ? 9 : 17) + Math.random() * (reduced ? 3 : 9);
    lastPeg = pointerIndex();

    var last = performance.now();
    var friction = reduced ? 0.9955 : 0.99875;

    function step(now){
      var dt = Math.min(48, now - last); last = now;
      velocity *= Math.pow(friction, dt);
      rotation += velocity * (dt/1000);
      apply();

      var p = pointerIndex();
      if(p !== lastPeg && p !== -1){ lastPeg = p; clack(Math.min(1, velocity/8)); }

      if(velocity > 0.05) requestAnimationFrame(step);
      else settle();
    }
    requestAnimationFrame(step);
  }

  function settle(){
    var n = items.length, seg = (Math.PI*2)/n;
    var a = (-rotation) % (Math.PI*2); if(a < 0) a += Math.PI*2;
    var within = a % seg;
    if(within < seg*0.03 || within > seg*0.97){ rotation += seg*0.06; apply(); }

    var idx = pointerIndex();
    var it = items[idx];
    currentItem = it;

    spinning = false;
    spinBtn.disabled = items.length < 2;
    spinBtn.textContent = "Spin";

    vLabel.textContent = "The wheel says";
    vValue.textContent = it.short;
    vFull.textContent = it.full;
    vRp.textContent = it.rp || "—";

    if(it.suds === null){
      prevLine.innerHTML = "Never rated — <b>set the baseline</b>";
    }else{
      prevLine.innerHTML = "Last time it was <b>" + it.suds + "</b>. Replace it.";
    }

    verdict.classList.add("is-set");
    if(navigator.vibrate && !reduced){ try{ navigator.vibrate([14,40,26]); }catch(e){} }

    if(elimBox.checked) pendingRemoval = it;
  }

  /* ---------- suds ---------- */
  function logSuds(){
    if(!currentItem) return;
    var raw = sudsInput.value.trim();
    if(raw === "") { sudsInput.focus(); return; }
    var v = Math.round(Number(raw));
    if(!isFinite(v)) { sudsInput.focus(); return; }
    v = Math.max(0, Math.min(100, v));

    var it = currentItem;
    var was = it.suds;
    it.prev = was;
    it.suds = v;
    persist(); render();

    if(was === null){
      loggedMsg.textContent = "Baseline set at " + v;
    }else if(v < was){
      loggedMsg.textContent = was + " → " + v + " · down " + (was - v);
    }else if(v > was){
      loggedMsg.textContent = was + " → " + v + " · up " + (v - was);
    }else{
      loggedMsg.textContent = "Held at " + v;
    }
    prevLine.innerHTML = "Now logged at <b>" + v + "</b>";
    sudsInput.value = "";
    sudsInput.blur();
  }

  /* ---------- list ---------- */
  function persist(){ save({items:items, eliminate:elimBox.checked}); }

  function render(){
    countEl.textContent = items.length;
    listEl.innerHTML = "";

    if(items.length === 0){
      var li0 = document.createElement("li");
      li0.className = "empty";
      li0.textContent = "Nothing on the wheel. Add at least two to spin.";
      listEl.appendChild(li0);
      spinBtn.disabled = true;
      draw();
      return;
    }

    items.forEach(function(it,i){
      var li = document.createElement("li");
      li.className = "item";

      var row = document.createElement("div");
      row.className = "row";

      var sw = document.createElement("span");
      sw.className = "swatch";
      sw.style.background = colorFor(i, items.length);

      var nm = document.createElement("span");
      nm.className = "name";
      nm.textContent = it.short;

      var badge = document.createElement("span");
      badge.className = "badge" + (it.suds === null ? "" : " has");
      badge.textContent = (it.suds === null) ? "—" : it.suds;
      badge.style.borderColor = sudsColor(it.suds);
      if(it.suds !== null) badge.style.color = sudsColor(it.suds);

      var delta = document.createElement("span");
      delta.className = "delta";
      if(it.suds !== null && it.prev !== null){
        var d = it.suds - it.prev;
        if(d < 0){ delta.className += " down"; delta.textContent = "↓" + Math.abs(d); }
        else if(d > 0){ delta.className += " up"; delta.textContent = "↑" + d; }
        else { delta.textContent = "–"; }
      }

      row.appendChild(sw); row.appendChild(nm); row.appendChild(badge); row.appendChild(delta);

      var det = document.createElement("div");
      det.className = "detail";

      var full = document.createElement("div");
      full.className = "full";
      full.textContent = it.full;

      var rpm = document.createElement("div");
      rpm.className = "rp-mini";
      var rpLab = document.createElement("span");
      rpLab.textContent = "No matter what";
      rpm.appendChild(rpLab);
      rpm.appendChild(document.createTextNode(it.rp || "—"));

      var acts = document.createElement("div");
      acts.className = "acts";
      var del = document.createElement("button");
      del.className = "btn sm danger"; del.type = "button";
      del.textContent = "Remove";
      del.addEventListener("click", function(e){
        e.stopPropagation();
        if(spinning) return;
        if(currentItem === it) currentItem = null;
        if(pendingRemoval === it) pendingRemoval = null;
        items.splice(i,1);
        persist(); render();
      });
      acts.appendChild(del);

      det.appendChild(full); det.appendChild(rpm); det.appendChild(acts);

      row.addEventListener("click", function(){ li.classList.toggle("open"); });

      li.appendChild(row); li.appendChild(det);
      listEl.appendChild(li);
    });

    spinBtn.disabled = spinning || items.length < 2;
    draw();
  }

  function shorten(s){
    var t = s.trim();
    if(t.length <= 22) return t;
    var cut = t.slice(0,22);
    var sp = cut.lastIndexOf(" ");
    if(sp > 10) cut = cut.slice(0,sp);
    return cut + "…";
  }

  function addItem(){
    var v = input.value.trim();
    if(!v){ input.focus(); return; }
    if(items.length >= 24){ vLabel.textContent = "Wheel is full at 24"; return; }
    items.push({
      n:null, short:shorten(v), full:v, rp:rpInput.value.trim(), suds:null, prev:null
    });
    input.value = ""; rpInput.value = "";
    persist(); render();
    input.focus();
  }

  document.getElementById("add").addEventListener("click", addItem);
  input.addEventListener("keydown", function(e){ if(e.key === "Enter") rpInput.focus(); });
  rpInput.addEventListener("keydown", function(e){ if(e.key === "Enter") addItem(); });
  spinBtn.addEventListener("click", spin);
  cv.addEventListener("click", spin);
  elimBox.addEventListener("change", persist);
  logBtn.addEventListener("click", logSuds);
  sudsInput.addEventListener("keydown", function(e){ if(e.key === "Enter") logSuds(); });

  document.getElementById("reset").addEventListener("click", function(){
    if(spinning) return;
    if(confirm("Reset to the default active list? Your SUDS numbers will be cleared.")){
      items = seed(); currentItem = null; pendingRemoval = null;
      persist(); render();
      verdict.classList.remove("is-set");
      vLabel.textContent = "Awaiting fate"; vValue.textContent = "—";
      loggedMsg.textContent = "";
    }
  });

  window.addEventListener("resize", sizeCanvas);
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(draw); }

  render();
  sizeCanvas();
  apply();

  /* ---------- PWA ---------- */
  var deferred = null, installBtn = document.getElementById("install");
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault(); deferred = e; installBtn.classList.add("show");
  });
  installBtn.addEventListener("click", function(){
    if(!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){ deferred = null; installBtn.classList.remove("show"); });
  });
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
