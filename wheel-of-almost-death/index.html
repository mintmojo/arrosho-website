<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wheel of Almost Death</title>
<meta name="description" content="Add your options. Give it a spin. Live with it.">
<meta name="theme-color" content="#15100E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Almost Death">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bevan:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15100E;
    --ink-2:#1E1715;
    --oxblood:#6E1F1B;
    --bone:#EDE3D2;
    --bone-dim:#A2968440;
    --brass:#C9922F;
    --teal:#2A7F7A;
    --rule:#3A2E2A;
    --stage: min(88vw, 400px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink);
    color:var(--bone);
    font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    font-size:16px;
    line-height:1.45;
    min-height:100dvh;
    overflow-x:hidden;
    padding:0 0 env(safe-area-inset-bottom);
    background-image:
      radial-gradient(120% 80% at 50% 0%, #241A17 0%, transparent 60%),
      repeating-linear-gradient(0deg, rgba(237,227,210,.014) 0 1px, transparent 1px 3px);
  }
  .wrap{max-width:520px;margin:0 auto;padding:22px 20px 56px}

  /* ---------- masthead ---------- */
  .eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:10px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--brass);margin:0 0 10px;
  }
  h1{
    font-family:"Bevan","Rockwell","Roboto Slab",Georgia,serif;
    font-weight:400;
    font-size:clamp(34px,11.5vw,52px);
    line-height:.92;
    letter-spacing:-.01em;
    margin:0;
    text-transform:uppercase;
    color:var(--bone);
    text-shadow:0 2px 0 #2A1E1B, 0 3px 14px rgba(0,0,0,.55);
  }
  h1 em{font-style:italic;color:var(--oxblood);-webkit-text-stroke:0}
  .tagline{
    margin:12px 0 0;font-size:14px;color:#A29684;max-width:30ch;
  }
  .hr{height:1px;background:var(--rule);margin:22px 0 8px}

  .stage{
    position:relative;width:var(--stage);height:var(--stage);
    margin:14px auto 0;
    display:grid;place-items:center;
  }
  .stage::before{ /* backboard */
    content:"";position:absolute;inset:-14px;border-radius:50%;
    background:radial-gradient(circle at 50% 42%, #2A201C 0%, #150F0D 70%);
    box-shadow:0 24px 60px rgba(0,0,0,.6), inset 0 0 0 1px #3A2E2A;
  }
  #wheel{
    position:relative;width:100%;height:100%;display:block;border-radius:50%;
    will-change:transform;
    box-shadow:0 0 0 6px #2A201C, 0 0 0 7px var(--brass), 0 10px 30px rgba(0,0,0,.55);
  }

  /* ticker: the brass flapper that clacks over each peg */
  .ticker{
    position:absolute;top:-20px;left:50%;width:26px;height:52px;
    margin-left:-13px;transform-origin:50% 8px;
    z-index:4;pointer-events:none;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.7));
    transition:transform .16s cubic-bezier(.2,1.6,.4,1);
  }

  /* hub = the spin control */
  .hub{
    position:absolute;z-index:5;
    width:30%;height:30%;border-radius:50%;
    border:1px solid var(--brass);
    background:radial-gradient(circle at 50% 34%, #33261F 0%, #170F0D 78%);
    color:var(--bone);
    font-family:"Bevan","Rockwell",Georgia,serif;
    font-size:clamp(13px,3.6vw,17px);letter-spacing:.06em;text-transform:uppercase;
    display:grid;place-items:center;cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.6), inset 0 1px 0 rgba(237,227,210,.16);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .hub:active{transform:scale(.94)}
  .hub:disabled{cursor:not-allowed;color:#6A5D51;border-color:#4A3B2A}
  .hub:focus-visible{outline:2px solid var(--brass);outline-offset:4px}

  /* ---------- verdict ---------- */
  .verdict{
    margin:30px auto 0;padding:16px 14px;text-align:center;
    border:1px dashed var(--rule);border-radius:3px;
    background:linear-gradient(#1B1412,#171110);
  }
  .verdict .label{
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.28em;
    text-transform:uppercase;color:#7C6F60;
  }
  .verdict .value{
    font-family:"Bevan","Rockwell",Georgia,serif;
    font-size:clamp(20px,6.4vw,30px);line-height:1.1;margin-top:8px;
    text-transform:uppercase;color:#5C5045;word-break:break-word;
  }
  .verdict.is-set .value{
    color:var(--bone);
    animation:stamp .38s cubic-bezier(.2,1.5,.35,1) both;
  }
  .verdict.is-set{border-style:solid;border-color:var(--oxblood)}
  .verdict .vnote{
    margin-top:10px;font-size:12.5px;line-height:1.5;color:#A29684;
    text-transform:none;font-family:"IBM Plex Sans",system-ui,sans-serif;
    letter-spacing:0;
  }
  @keyframes stamp{
    0%{transform:scale(1.5) rotate(-4deg);opacity:0;filter:blur(3px)}
    60%{opacity:1;filter:blur(0)}
    100%{transform:scale(1) rotate(-1.2deg);opacity:1}
  }

  /* ---------- timer bar (Timed/Spam only) ---------- */
  /* ---------- log + tracker ---------- */
  .logRow{
    display:none;gap:10px;margin:12px 0 0;
  }
  .logRow.show{display:flex}
  .logBtn{
    flex:1 1 0;font-family:"IBM Plex Mono",monospace;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    padding:12px 10px;border-radius:3px;background:transparent;cursor:pointer;
    transition:background .16s,color .16s;
  }
  .logBtn.did{border:1px solid #4E7A52;color:#7FA983}
  .logBtn.did:hover{background:#4E7A52;color:#12100E}
  .logBtn.skipped{border:1px solid #8A6A2E;color:#C79C4A}
  .logBtn.skipped:hover{background:#8A6A2E;color:#12100E}
  .logBtn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  .tracker{
    display:grid;grid-template-columns:repeat(3,1fr);
    margin:14px 0 0;border:1px solid var(--rule);border-radius:3px;overflow:hidden;
  }
  .tracker div{padding:12px 8px;text-align:center;border-right:1px solid var(--rule)}
  .tracker div:last-child{border-right:0}
  .tracker .n{
    display:block;font-family:"IBM Plex Mono",monospace;
    font-size:23px;color:var(--brass);font-variant-numeric:tabular-nums;line-height:1;
  }
  .tracker .k{
    display:block;margin-top:5px;font-family:"IBM Plex Mono",monospace;
    font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8A7D6E;
  }

  #adderRow.hide, #footRow.hide{display:none}
  #list.readonly .kill{display:none}
  #list.readonly li{opacity:.9}

  /* ---------- options ---------- */
  .sec-head{
    display:flex;align-items:baseline;justify-content:space-between;
    margin:34px 0 12px;
  }
  .sec-head h2{
    font-family:"IBM Plex Mono",monospace;font-weight:500;
    font-size:11px;letter-spacing:.24em;text-transform:uppercase;
    color:#A29684;margin:0;
  }
  .count{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--brass)}

  .adder{display:flex;gap:8px}
  input[type=text]{
    flex:1;min-width:0;
    background:#100C0B;color:var(--bone);
    border:1px solid var(--rule);border-radius:3px;
    padding:13px 12px;font:inherit;font-size:16px;
  }
  input[type=text]::placeholder{color:#6A5D51}
  input[type=text]:focus{outline:none;border-color:var(--brass)}
  .btn{
    border:1px solid var(--rule);border-radius:3px;
    background:#241A17;color:var(--bone);
    font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.12em;
    text-transform:uppercase;padding:0 16px;cursor:pointer;
  }
  .btn:hover{border-color:var(--brass);color:var(--brass)}
  .btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  ul{list-style:none;margin:14px 0 0;padding:0}
  li{
    display:flex;align-items:flex-start;gap:11px;
    padding:11px 4px;border-bottom:1px solid #241C19;
  }
  li .swatch{width:11px;height:11px;border-radius:2px;flex:none;transform:rotate(45deg);margin-top:5px}
  li .textcol{flex:1;min-width:0}
  li .name{display:block;font-size:15px;line-height:1.35}
  li .note{display:block;font-size:11.5px;color:#8A7D6E;line-height:1.45;margin-top:3px}
  li .kill{margin-top:-3px}
  li .kill{
    flex:none;width:30px;height:30px;border:0;border-radius:50%;
    background:transparent;color:#6A5D51;font-size:17px;line-height:1;cursor:pointer;
  }
  li .kill:hover{color:var(--oxblood);background:#231715}
  li .kill:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
  .empty{color:#6A5D51;font-size:14px;padding:16px 4px;border-bottom:1px solid #241C19}

  .foot{
    display:flex;align-items:center;justify-content:space-between;
    gap:14px;margin-top:18px;flex-wrap:wrap;
  }
  label.toggle{
    display:flex;align-items:center;gap:9px;cursor:pointer;
    font-size:13px;color:#A29684;
  }
  label.toggle input{accent-color:var(--oxblood);width:17px;height:17px}
  .linkish{
    background:none;border:0;padding:4px 0;cursor:pointer;
    font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:#6A5D51;
  }
  .linkish:hover{color:var(--oxblood)}
  .colophon{
    margin-top:38px;padding-top:16px;border-top:1px solid var(--rule);
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.2em;
    text-transform:uppercase;color:#4E443B;display:flex;justify-content:space-between;gap:10px;
  }
  .colophon a{color:#4E443B;text-decoration:none}
  .colophon a:hover{color:var(--brass)}
  #install{display:none}
  #install.show{display:inline-block}

  @media (prefers-reduced-motion:reduce){
    .ticker{transition:none}
    .verdict.is-set .value{animation:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Arrosho &middot; Decision Apparatus No. 1</p>
    <h1>Wheel of<br><em>Almost</em> Death</h1>
    <p class="tagline">Add your options. Give it a spin. Live with it.</p>
  </header>

  <div class="hr"></div>

  <div class="stage">
    <canvas id="wheel" width="800" height="800" aria-label="Option wheel"></canvas>
    <svg class="ticker" viewBox="0 0 26 52" aria-hidden="true">
      <circle cx="13" cy="8" r="5.5" fill="#C9922F"/>
      <circle cx="13" cy="8" r="2" fill="#15100E"/>
      <path d="M8.5 10 H17.5 L13 30 Z" fill="#C9922F"/>
      <path d="M13 10 L17.5 10 L13 30 Z" fill="#8E6415"/>
    </svg>
    <button class="hub" id="spin" type="button">Spin</button>
  </div>

  <div class="verdict" id="verdict">
    <div class="label" id="verdictLabel">Awaiting fate</div>
    <div class="value" id="verdictValue">&mdash;</div>
    <div class="vnote" id="verdictNote" style="display:none"></div>
  </div>

  <div class="logRow" id="logRow">
    <button class="logBtn did" id="logDid" type="button">I did it</button>
    <button class="logBtn skipped" id="logSkip" type="button">I skipped it</button>
  </div>

  <div class="tracker">
    <div><span class="n" id="tDid">0</span><span class="k">Done today</span></div>
    <div><span class="n" id="tSkip">0</span><span class="k">Skipped today</span></div>
    <div><span class="n" id="tTotal">0</span><span class="k">Done all time</span></div>
  </div>

  <section id="listSection">
    <div class="sec-head">
      <h2 id="wheelName">On the wheel</h2>
      <span class="count" id="count">0</span>
    </div>

    <div class="adder" id="adderRow">
      <input type="text" id="newOption" placeholder="Add an option" maxlength="60"
             autocomplete="off" autocapitalize="sentences" spellcheck="false">
      <button class="btn" id="add" type="button">Add</button>
    </div>

    <ul id="list"></ul>

    <div class="foot" id="footRow">
      <label class="toggle">
        <input type="checkbox" id="eliminate">
        Remove the winner after each spin
      </label>
      <button class="linkish" id="clear" type="button">Clear all</button>
      <button class="linkish" id="resetCounts" type="button">Reset counts</button>
    </div>
  </section>

  <div class="colophon">
    <span><button class="linkish" id="install" type="button" style="letter-spacing:.2em">Install app</button></span>
    <a href="https://arrosho.com">arrosho.com</a>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- storage (degrades to memory if blocked) ---------- */
  var KEY = "woad.v5";
  var V4_KEY = "woad.v4"; // v4 had everything/home; v5 is one wheel, passives removed
  var V3_KEY = "woad.v3"; // v3 had timed/home/inperson
  var V2_KEY = "woad.v2"; // v2 had home/inperson only; timed was a derived union, never stored
  var V1_KEY = "woad.v1"; // v1 was a single flat wheel
  var mem = null;
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return mem;
  }
  function save(state){
    mem = state;
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }

  /* ---------- one wheel ----------
     Everything on it has to be startable on demand. Passive items — the ones
     that only happen when something triggers them (someone asks you a question,
     you already sent the thing) — came off on 2026-08-27: you can't spin for an
     opportunity that hasn't arrived. They're still real exposures, they just
     belong on a when-it-happens card, not a randomizer.

     `own` marks the two that are physically tied to this house (the starter,
     the laundry pile). A laptop is not own-space — doing desk work somewhere
     you aren't set up is the point, not a problem. */
  var DEFAULTS = [
    {"text": "Tell someone from memory who'd know better", "note": "e.g. tell a baker friend your starter's hydration % from memory instead of checking your notes first, even though they'd catch it if you're off."},
    {"text": "Think of it, just do it — no revisiting for 24h", "note": "e.g. an idea for an Arrosho post pops up — post it as-is, don't reopen or tweak it for a full day."},
    {"text": "Finish a task halfway, stop when your phone timer says", "note": "e.g. set a timer on your phone for a length you don't get to choose carefully, start folding laundry or writing, and stop dead when it goes — no finishing the thought."},
    {"text": "Admit \u201cyou were right,\u201d no explaining", "note": "e.g. your mom pointed out you mismeasured a recipe last week — text her \u201cyou were right about that,\u201d nothing else added."},
    {"text": "Send a deliverable, zero framing", "note": "e.g. send the Arrosho outreach draft with no \u201cquick draft, lmk what you think\u201d — just the file."},
    {"text": "15-min single draft, just send it", "note": "e.g. set a 15-min timer on your phone, write toward a book outline, send whatever exists when it goes off — don't call it a draft."},
    {"text": "Ask what I've been wrong about, agree", "note": "e.g. ask a roommate \u201cwhat have I been wrong about that I haven't admitted?\u201d and agree with the first thing they say, no debating."},
    {"text": "One real sentence toward the BYU essay", "note": "e.g. open one of the actual prompts and write one honest sentence toward it before outlining or reading example essays."},
    {"text": "Cold-call solo, zero rehearsal", "note": "e.g. pick up the phone and dial a real lead within 15 seconds of deciding to call — no mental rehearsal of what you'll say."},
    {"text": "Dial the developer list within 15 seconds", "note": "Open the call list and dial. No rereading the outreach script first, no skimming objection handling."},
    {"text": "Work the unanswered SMS replies, top to bottom", "note": "In order. No triaging which ones look promising first — the order is the order."},
    {"text": "Follow up a lead who went quiet, no rewrite", "note": "No rereading before send. No softening."},
    {"text": "Sort 10 Texas names spec-vs-custom, one pass, then dial", "note": "No re-sorting. A wrong sort gets found on the call, not before it."},
    {"text": "Upload the next list and launch the same sitting", "note": "No verification pass beyond the one the SOP actually requires."},
    {"text": "Write one SMS template, launch it", "note": "No second version held in reserve. No \u201cI'll test both.\u201d"},
    {"text": "State an offer number after one pass of comps", "note": "Don't recalculate. Don't re-pull. Say it and let it stand. (Scope question open with your team.)"},
    {"text": "Push one change to arrosho.com live", "note": "No checking how it looks. Not tonight either."},
    {"text": "Sourdough: commit at hour 2, ready or not", "note": "e.g. feed the starter, and at the 2-hour mark mix and shape the dough even if you're not sure it's peaked.", "own": true},
    {"text": "Fold laundry, first item within 10 sec", "note": "e.g. walk up to the pile and fold the very first item you touch within 10 seconds — no sorting by color first.", "own": true},
    {"text": "Cards: answer instantly, as absolute fact", "note": "e.g. someone flips a card with a question on it — answer the instant it's asked, out loud, stated as fact, no \u201cI think\u201d or \u201cmaybe.\u201d"},
    {"text": "Get corrected publicly, say thanks, stop", "note": "e.g. someone in group corrects something you said — reply only \u201cyou're right, thanks\u201d and don't defend the original point, then or later."},
    {"text": "Board confession: taught it, didn't do it", "note": "e.g. write on the board something you've taught or written that you personally haven't followed through on, say it out loud — no self-punishing wrap-up."},
    {"text": "Leave mid-conversation, zero context", "note": "e.g. mid-topic, say \u201cI gotta go\u201d and actually leave — no explanation, no follow-up text smoothing it over later."},
    {"text": "Procrastinated task, no extra time or materials", "note": "e.g. pull out the Arrosho analysis or book outline you've been avoiding and work on it inside session — no extra time, no missing materials excused."},
    {"text": "Cold-call from session, zero rehearsal", "note": "e.g. if logistics allow, dial a real lead from the room, zero rehearsal, in front of your team."}
  ];

  /* Retired 2026-08-27 — passive, so they can't be spun for. Stripped out of any
     saved list on upgrade so they don't linger from an older version. */
  var RETIRED = [
    "Answer from memory, don't look it up after",
    "Give an estimate, no hedge",
    "Misremember a detail, catch it, say nothing",
    "Say \u201cI don't know.\u201d Full stop.",
    "Let someone find their own word",
    "Don't correct someone who needs help",
    "Submit the moment it's complete, no re-read",
    "Leave a known error in something already sent",
    "Notice a typo, don't send the correction"
  ];

  var saved = load();
  var v3Saved = null, v2Saved = null, v1Saved = null;
  if(!saved){
    try{
      var rawV4 = localStorage.getItem(V4_KEY);
      if(rawV4) v3Saved = JSON.parse(rawV4);
      if(!v3Saved){
        var rawV3 = localStorage.getItem(V3_KEY);
        if(rawV3) v3Saved = JSON.parse(rawV3);
      }
    }catch(e){}
    if(!v3Saved){
      try{
        var rawV2 = localStorage.getItem(V2_KEY);
        if(rawV2) v2Saved = JSON.parse(rawV2);
      }catch(e){}
    }
    if(!v3Saved && !v2Saved){
      try{
        var rawV1 = localStorage.getItem(V1_KEY);
        if(rawV1) v1Saved = JSON.parse(rawV1);
      }catch(e){}
    }
  }
  var migrated = saved || v3Saved || v2Saved;

  // items are {text, note, passive, own} — note is an optional example shown under the
  // label; passive means it can't be started on demand; own means it needs your own
  // space or screen. Handles plain strings and older saved data transparently.
  function normalizeItem(it){
    if(typeof it === "string") return {text: it, note: "", passive: false, own: false};
    if(it && typeof it.text === "string"){
      return {text: it.text, note: it.note || "", passive: !!it.passive, own: !!it.own};
    }
    return null;
  }
  function normalizeList(list){
    return (list || []).map(normalizeItem).filter(Boolean);
  }

  var state = {
    eliminate: !!(migrated && migrated.eliminate),
    options: []
  };
  if(migrated && migrated.options && Array.isArray(migrated.options.home) && migrated.options.home.length){
    var retired = {}; RETIRED.forEach(function(t){ retired[t] = true; });
    state.options = normalizeList(migrated.options.home).filter(function(it){ return !retired[it.text]; });
    var have = {}; state.options.forEach(function(it){ have[it.text] = true; });
    DEFAULTS.forEach(function(d){ if(!have[d.text]) state.options.push(normalizeItem(d)); });
  }else{
    state.options = normalizeList(DEFAULTS);
  }

  // mutated in place (push/splice) so the rest of the app doesn't need to change
  var options = state.options;
  var eliminate = state.eliminate;
  var adderRow = document.getElementById("adderRow");
  var footRow = document.getElementById("footRow");

  /* ---------- palette ---------- */
  var PALETTE = ["#6E1F1B","#C9922F","#2A7F7A","#8E4B22","#4A3D6B","#7C7A2E"];
  function colorFor(i,n){
    var c = PALETTE[i % PALETTE.length];
    // avoid the last slice matching the first when the count wraps the palette
    if(n > 1 && i === n-1 && c === PALETTE[0]) c = PALETTE[Math.floor(PALETTE.length/2)];
    return c;
  }

  /* ---------- elements ---------- */
  var cv = document.getElementById("wheel");
  var ctx = cv.getContext("2d");
  var ticker = document.querySelector(".ticker");
  var spinBtn = document.getElementById("spin");
  var listEl = document.getElementById("list");
  var countEl = document.getElementById("count");
  var input = document.getElementById("newOption");
  var verdict = document.getElementById("verdict");
  var vLabel = document.getElementById("verdictLabel");
  var vValue = document.getElementById("verdictValue");
  var vNote = document.getElementById("verdictNote");
  var elimBox = document.getElementById("eliminate");
  elimBox.checked = eliminate;

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- wheel drawing ---------- */
  var rotation = 0;      // radians, clockwise positive
  var velocity = 0;
  var spinning = false;
  var lastPeg = -1;

  function sizeCanvas(){
    var rect = cv.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    var px = Math.max(240, Math.round(rect.width * dpr));
    if(cv.width !== px){ cv.width = px; cv.height = px; }
    draw();
  }

  function fitText(text, maxPx, startPx){
    var size = startPx;
    ctx.font = "500 " + size + "px 'IBM Plex Sans', system-ui, sans-serif";
    while(ctx.measureText(text).width > maxPx && size > 9){
      size -= 1;
      ctx.font = "500 " + size + "px 'IBM Plex Sans', system-ui, sans-serif";
    }
    if(ctx.measureText(text).width > maxPx){
      var t = text;
      while(t.length > 1 && ctx.measureText(t + "\u2026").width > maxPx) t = t.slice(0,-1);
      text = t + "\u2026";
    }
    return text;
  }

  function draw(){
    var S = cv.width, R = S/2, cx = R, cy = R;
    ctx.clearRect(0,0,S,S);
    var n = options.length;

    if(n === 0){
      ctx.fillStyle = "#1E1715";
      ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = "#6A5D51";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "500 " + Math.round(S*0.038) + "px 'IBM Plex Mono', monospace";
      ctx.fillText("EMPTY", cx, cy - S*0.10);
      return;
    }

    var seg = (Math.PI*2)/n;
    for(var i=0;i<n;i++){
      var a0 = -Math.PI/2 + i*seg;
      var a1 = a0 + seg;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,R,a0,a1);
      ctx.closePath();
      ctx.fillStyle = colorFor(i,n);
      ctx.fill();
      if(n > 1){
        ctx.strokeStyle = "rgba(21,16,14,.55)";
        ctx.lineWidth = Math.max(1, S*0.004);
        ctx.stroke();
      }

      // label, reading outward
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(a0 + seg/2);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      var maxW = R * 0.62;
      var base = Math.min(Math.round(S*0.042), Math.round(seg * R * 0.55));
      var label = fitText(String(options[i].text), maxW, Math.max(10, base));
      ctx.fillStyle = "#F3ECE0";
      ctx.shadowColor = "rgba(0,0,0,.45)";
      ctx.shadowBlur = S*0.008;
      ctx.fillText(label, R*0.86, 0);
      ctx.restore();
    }

    // pegs at each boundary
    for(var j=0;j<n;j++){
      var pa = -Math.PI/2 + j*seg;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(pa)*R*0.955, cy + Math.sin(pa)*R*0.955, Math.max(1.5,S*0.009), 0, Math.PI*2);
      ctx.fillStyle = "#EDE3D2";
      ctx.fill();
    }

    // inner rings
    ctx.beginPath(); ctx.arc(cx,cy,R*0.985,0,Math.PI*2);
    ctx.strokeStyle = "rgba(21,16,14,.5)"; ctx.lineWidth = Math.max(2,S*0.012); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,R*0.20,0,Math.PI*2);
    ctx.fillStyle = "#15100E"; ctx.fill();
    ctx.strokeStyle = "#C9922F"; ctx.lineWidth = Math.max(1,S*0.005); ctx.stroke();
  }

  function apply(){ cv.style.transform = "rotate(" + rotation + "rad)"; }

  function pointerIndex(){
    var n = options.length;
    if(!n) return -1;
    var seg = (Math.PI*2)/n;
    var a = (-rotation) % (Math.PI*2);
    if(a < 0) a += Math.PI*2;
    return Math.floor(a/seg) % n;
  }

  /* ---------- clack ---------- */
  var actx = null;
  function clack(strength){
    if(reduced) return;
    ticker.style.transform = "rotate(" + (-16*Math.min(1,strength)) + "deg)";
    setTimeout(function(){ ticker.style.transform = "rotate(0deg)"; }, 60);
    try{
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var t = actx.currentTime;
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(880 + Math.random()*120, t);
      o.frequency.exponentialRampToValueAtTime(220, t + 0.05);
      g.gain.setValueAtTime(0.10 * Math.min(1, strength), t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + 0.07);
    }catch(e){}
  }

  /* ---------- spin ---------- */
  function spin(){
    if(spinning || options.length < 2) return;
    hideLog();
    spinning = true;
    spinBtn.disabled = true;
    spinBtn.textContent = "\u2022 \u2022 \u2022";
    verdict.classList.remove("is-set");
    vLabel.textContent = "Deciding";
    vValue.textContent = "\u2014";
    vNote.style.display = "none";

    velocity = (reduced ? 9 : 17) + Math.random() * (reduced ? 3 : 9);
    lastPeg = pointerIndex();

    var last = performance.now();
    var friction = reduced ? 0.9955 : 0.99875;

    function step(now){
      var dt = Math.min(48, now - last); last = now;
      var f = Math.pow(friction, dt);
      velocity *= f;
      rotation += velocity * (dt/1000);
      apply();

      var p = pointerIndex();
      if(p !== lastPeg && p !== -1){ lastPeg = p; clack(Math.min(1, velocity/8)); }

      if(velocity > 0.05){
        requestAnimationFrame(step);
      }else{
        settle();
      }
    }
    requestAnimationFrame(step);
  }

  function settle(){
    // nudge off an exact boundary so the ticker never straddles two slices
    var n = options.length, seg = (Math.PI*2)/n;
    var a = (-rotation) % (Math.PI*2); if(a < 0) a += Math.PI*2;
    var within = a % seg;
    if(within < seg*0.03 || within > seg*0.97){ rotation += seg*0.06; apply(); }

    var idx = pointerIndex();
    var winner = options[idx];
    spinning = false;
    spinBtn.disabled = options.length < 2;
    spinBtn.textContent = "Spin";
    vLabel.textContent = "The wheel says";
    vValue.textContent = winner.text;
    vNote.textContent = winner.note || "";
    vNote.style.display = winner.note ? "block" : "none";
    verdict.classList.add("is-set");

    if(navigator.vibrate && !reduced){ try{ navigator.vibrate([14,40,26]); }catch(e){} }

    if(elimBox.checked){
      options.splice(idx,1);
      persist(); render();
    }

    showLog();
  }

  function resetVerdict(){
    verdict.classList.remove("is-set");
    vLabel.textContent = "Awaiting fate";
    vValue.textContent = "—";
    vNote.style.display = "none";
    hideLog();
  }

  /* ---------- done / skipped tracker ---------- */
  var LOG_KEY = "woad.log.v1";
  var logRow = document.getElementById("logRow");
  function todayKey(){
    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
  }
  function loadLog(){
    try{
      var raw = localStorage.getItem(LOG_KEY);
      if(raw){
        var l = JSON.parse(raw);
        if(l && typeof l === "object") return l;
      }
    }catch(e){}
    return {day: todayKey(), did: 0, skip: 0, total: 0};
  }
  var logState = loadLog();
  if(logState.day !== todayKey()){ logState.day = todayKey(); logState.did = 0; logState.skip = 0; }
  function saveLog(){
    try{ localStorage.setItem(LOG_KEY, JSON.stringify(logState)); }catch(e){}
  }
  function renderLog(){
    document.getElementById("tDid").textContent = logState.did;
    document.getElementById("tSkip").textContent = logState.skip;
    document.getElementById("tTotal").textContent = logState.total;
  }
  function showLog(){ logRow.classList.add("show"); }
  function hideLog(){ logRow.classList.remove("show"); }
  function record(done){
    if(done){ logState.did++; logState.total++; } else { logState.skip++; }
    saveLog(); renderLog(); hideLog();
    vLabel.textContent = done ? "Logged \u2014 done" : "Logged \u2014 skipped";
  }
  document.getElementById("logDid").addEventListener("click", function(){ record(true); });
  document.getElementById("logSkip").addEventListener("click", function(){ record(false); });
  document.getElementById("resetCounts").addEventListener("click", function(){
    if(!confirm("Reset done and skipped counts?")) return;
    logState = {day: todayKey(), did: 0, skip: 0, total: 0};
    saveLog(); renderLog();
  });
  renderLog();

  /* ---------- list ---------- */
  function persist(){
    state.options = options;
    state.eliminate = elimBox.checked;
    save({eliminate: state.eliminate, options: {home: options}});
  }

  function render(){
    countEl.textContent = options.length;
    listEl.innerHTML = "";
    if(options.length === 0){
      var li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Nothing on the wheel. Add at least two options to spin.";
      listEl.appendChild(li);
    }else{
      options.forEach(function(opt,i){
        var li = document.createElement("li");
        var sw = document.createElement("span");
        sw.className = "swatch";
        sw.style.background = colorFor(i, options.length);
        var col = document.createElement("span");
        col.className = "textcol";
        var nm = document.createElement("span");
        nm.className = "name"; nm.textContent = opt.text;
        col.appendChild(nm);
        if(opt.note){
          var nt = document.createElement("span");
          nt.className = "note"; nt.textContent = opt.note;
          col.appendChild(nt);
        }
        li.appendChild(sw); li.appendChild(col);
        var kill = document.createElement("button");
        kill.className = "kill"; kill.type = "button";
        kill.setAttribute("aria-label", "Remove " + opt.text);
        kill.textContent = "\u00d7";
        kill.addEventListener("click", function(){
          if(spinning) return;
          options.splice(i,1); persist(); render();
        });
        li.appendChild(kill);
        listEl.appendChild(li);
      });
    }
    spinBtn.disabled = spinning || options.length < 2;
    draw();
  }

  function addOption(){
    var v = input.value.trim();
    if(!v) { input.focus(); return; }
    if(options.length >= 40){ vLabel.textContent = "Wheel is full at 40"; return; }
    var item = {text: v, note: "", passive: false, own: false};
    options.push(item);
    input.value = "";
    persist(); render();
    input.focus();
  }

  document.getElementById("add").addEventListener("click", addOption);
  input.addEventListener("keydown", function(e){ if(e.key === "Enter") addOption(); });
  spinBtn.addEventListener("click", spin);
  cv.addEventListener("click", spin);
  elimBox.addEventListener("change", persist);
  document.getElementById("clear").addEventListener("click", function(){
    if(spinning) return;
    if(!options.length || confirm("Clear every option?")){
      options = []; persist(); render();
      resetVerdict();
    }
  });

  window.addEventListener("resize", sizeCanvas);
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(draw); }

  render();
  sizeCanvas();
  apply();

  /* ---------- PWA ---------- */
  var deferred = null, installBtn = document.getElementById("install");
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault(); deferred = e; installBtn.classList.add("show");
  });
  installBtn.addEventListener("click", function(){
    if(!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){ deferred = null; installBtn.classList.remove("show"); });
  });
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
