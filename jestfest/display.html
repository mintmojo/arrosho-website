<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jest Fest — Display</title>
<meta name="description" content="Jest Fest's shared screen: room code, roster, game picker and the game itself.">
<meta name="theme-color" content="#D7E0E2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Archivo+Black&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/display.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2B3F45">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Jest Fest">
</head>
<body class="jf-display">
<div id="app"></div>
<script type="module" src="js/display.js"></script>
<script>
  // Registered late and failure-tolerant: the app must work even if the
  // service worker is unavailable (private mode, http, unsupported browser).
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
