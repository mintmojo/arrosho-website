<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Jest Fest — Join</title>
<meta name="description" content="Join a Jest Fest room from your phone.">
<meta name="theme-color" content="#3E442B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Archivo+Black&family=Inter:wght@400;500;600&display=swap">

</head>
<body class="jf-controller">
<div id="app"></div>
<script type="module" src="js/controller.js"></script>
<script>
  // Registered late and failure-tolerant: the app must work even if the
  // service worker is unavailable (private mode, http, unsupported browser).
  //
  // The reload dance below exists because of a real outage: v1 of this worker
  // used a plain fetch(), which reads the browser HTTP cache, so "network
  // first" silently became "cache first" and devices kept running deleted
  // code after a deploy. Clearing site data by hand is not something a guest
  // at a party will ever do, so the page now forces an update check on every
  // load and reloads itself once when a new worker takes control.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").then((reg) => {
        // Ask right now whether a newer sw.js exists, rather than waiting for
        // the browser's own (much lazier) update schedule.
        reg.update().catch(() => {});
        setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
      }).catch(() => {});

      // When a new worker claims this page, reload once so the fresh assets
      // are actually the ones running. The sessionStorage guard makes a
      // reload loop impossible even if something goes wrong.
      let reloading = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloading) return;
        try {
          if (sessionStorage.getItem("jf-sw-reloaded") === "1") return;
          sessionStorage.setItem("jf-sw-reloaded", "1");
        } catch (e) { /* private mode: fall through, the guard below still holds */ }
        reloading = true;
        location.reload();
      });
    });
  }
</script>
</body>
</html>
