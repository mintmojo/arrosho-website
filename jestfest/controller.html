<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Jest Fest — Join</title>
<meta name="description" content="Join a Jest Fest room from your phone.">
<meta name="theme-color" content="#3E442B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/controller.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2B3F45">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Jest Fest">
</head>
<body class="jf-controller">
<div id="app"></div>
<script type="module" src="js/controller.js"></script>
<script>
  // Registered late and failure-tolerant: the app must work even if the
  // service worker is unavailable (private mode, http, unsupported browser).
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
